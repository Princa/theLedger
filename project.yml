name: theLedger
options:
  bundleIdPrefix: com.oakvillerangers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  theLedger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: theLedger
    info:
      path: theLedger/Info.plist
      properties:
        CFBundleDisplayName: "Rink Ledger"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: princa.RinkLedger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Matches the signing setup already used by the GameDay app under
        # this same Apple ID, so RinkLedger can build to a real device too.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2Y7JY873N6
