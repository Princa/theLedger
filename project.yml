name: theLedger
options:
  bundleIdPrefix: com.oakvillerangers
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  theLedger:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: theLedger
    info:
      path: theLedger/Info.plist
      properties:
        CFBundleDisplayName: "Rink Ledger"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oakvillerangers.rinkledger
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        # Simulator-only project: pin signing off so Xcode's automatic
        # provisioning resolution can never silently rewrite the bundle
        # identifier (it did, twice, once it found a real dev team).
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        DEVELOPMENT_TEAM: ""
